<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Structure Video</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111827;
        font-family: Arial, sans-serif;
      }

      .video-card {
        background: #1f2937;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }

      video {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="video-card">
      <img src="assets/conformer_A_cis.gif" alt="Conformer A cis" width="640" />
    </div>
  </body>
